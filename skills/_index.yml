safety_posture: >-
  FullEnrich builds credit-spend safety into the skills rather than into OAuth
  scopes: the documented pattern is preview -> show balance -> confirm -> execute
  -> report, and v1.0.3 added explicit opt-out/suppression/do-not-contact handling
  in outreach workflows plus a mandatory confirmation before sequencer mutations.
  Because the MCP server exposes a single `api:mcp` scope, these guardrails are
  conventions the client must honor, not authorization boundaries.
