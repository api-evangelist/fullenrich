gap_note: >-
  No first-party REST client library exists for JavaScript, Python, Java, .NET, Go,
  Ruby, PHP or Rust. The docs show raw HTTP examples and point integrators at
  no-code platforms (Zapier, Make, Clay, n8n) or the MCP server instead. This is a
  real ergonomics gap for teams embedding the API directly.

