description: >-
  FullEnrich publishes no conventional server-side client SDK in any language
  registry. Its first-party distributed artifacts are an n8n community node on
  npm and an MCP/Agent-Skills plugin distributed from GitHub and the MCP Registry.
  Integration is otherwise documented as direct REST calls (Bearer API key) or
  through the hosted MCP server.

