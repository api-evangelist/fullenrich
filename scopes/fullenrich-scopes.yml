observations:
  - >-
    The application server's scopes are cleanly resource:action split, which is
    good practice, but they are undocumented — an integrator cannot discover them
    without reading the well-known metadata.
  - >-
    The MCP server takes the opposite approach: one scope for everything. Agent
    least-privilege is therefore not expressible on the MCP surface; the
    preview-then-confirm pattern FullEnrich documents is a client-side convention,
    not a scope boundary.

