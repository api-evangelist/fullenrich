description: >-
  FullEnrich publishes two OAuth scope surfaces. The application authorization
  server declares 13 resource-scoped, read/write-split scopes. The MCP
  authorization server declares a single coarse `api:mcp` scope covering the whole
  agent surface. Neither is documented in prose anywhere on the developer site —
  both were recovered from well-known metadata, and no human-readable scope
  reference page exists.
docs: null
