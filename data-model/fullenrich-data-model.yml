source: >-
  openapi/_original/fullenrich-openapi.yml — 38 component schemas, $ref edges and
  id-reference fields. Field semantics enriched from
  https://docs.fullenrich.com/api/v2/general/data-dictionary and /general/email-status.
description: >-
  FullEnrich's object graph has two roots: an asynchronous Enrichment job that owns
  per-contact Records, and a synchronous Search/Lookup surface that returns Person
  and Company directly. The two share the same Person/Company/Employment
  vocabulary, which is what makes a search result enrichable without remapping.

id_conventions:
  enrichment_id:
    type: string (uuid)
    prefix: none
    example_shape: 2db5ea61-1752-42cf-8ea1-ab1da060cd0a
    scope: Identifies one bulk job. Valid for 3 months, then unresolvable.
  person_id:
    type: string
    field: Person.id / Profile.id
  company_id:
    type: string
    field: Company.id / EmploymentCompany.id
  external_key:
    field: custom
    detail: Caller-supplied string map (max 10 keys, 100 chars/value) echoed back unchanged — the join key back to a CRM.
  natural_keys:
    - domain (company)
    - professional_network_url / professional_network_id (person and company)
    - email (reverse lookup input)

entities:
  - name: Enrichment
    schema: ResponseGetContactBulkEnrich
    root: true
    description: An asynchronous bulk contact-enrichment job.
    fields: [id, name, status, data, cost]
    lifecycle_states: [CREATED, IN_PROGRESS, CANCELED, CREDITS_INSUFFICIENT, FINISHED, RATE_LIMIT, UNKNOWN]

  - name: ReverseEmailEnrichment
    schema: ResponseGetContactBulkReverseEmail
    root: true
    description: An asynchronous bulk reverse-email-lookup job.
    fields: [id, name, status, data, cost]

  - name: Cost
    schema: Cost
    description: Credits consumed by a job.
    fields: [credits]

  - name: RecordEnrichment
    schema: RecordEnrichment
    description: One enriched contact inside an enrichment job.
    fields: [input, custom, contact_info, profile]

  - name: RecordReverseEmail
    schema: RecordReverseEmail
    description: One resolved identity inside a reverse-email job. Carries no contact_info — the email was the input.
    fields: [input, custom, profile]

  - name: ContactEnrichedInformation
    schema: ContactEnrichedInformation
    description: The found contact channels for one person, with best-match shortcuts.
    fields: [most_probable_work_email, most_probable_personal_email, most_probable_phone, work_emails, personal_emails, phones]

  - name: Email
    schema: Email
    description: A single email address with its verification status.
    fields: [email, status]
    enums:
      status: [DELIVERABLE, HIGH_PROBABILITY, CATCH_ALL, INVALID, INVALID_DOMAIN]

  - name: Phone
    schema: Phone
    description: A single phone number in E.164 with an ISO region code.
    fields: [number, region]

  - name: Person
    schema: Person
    root: true
    description: A person profile — the shared entity across search, lookup and enrichment.
    fields: [id, full_name, first_name, last_name, headline, description, location, social_profiles, educations, languages, skills, employment]

  - name: Company
    schema: Company
    root: true
    description: A company profile.
    fields: [id, name, domain, website, description, year_founded, headcount, headcount_range, company_type, locations, social_profiles, specialties]

  - name: Employment
    schema: Employment
    description: One position a person has held.
    fields: [title, seniority, job_functions, description, company, is_current, start_at, end_at]

  - name: EmploymentCompany
    schema: EmploymentCompany
    description: The company side of an employment record — a fuller company shape than Company in some fields (adds industry, specialties).
    fields: [id, name, domain, website, description, year_founded, headcount, headcount_range, company_type, specialties, locations, industry]

  - name: PersonEducation
    schema: PersonEducation
    fields: [school_name, degree, start_at, end_at]

  - name: PersonLanguage
    schema: PersonLanguage
    fields: [language, proficiency]

  - name: CompanyAddress
    schema: CompanyAddress
    fields: [line1, line2, city, region, country, country_code]

  - name: PersonSocialProfile
    schema: PersonSocialProfile
    fields: [professional_network]

  - name: CompanySocialProfile
    schema: CompanySocialProfile
    fields: [professional_network]

  - name: Credits
    schema: Credits
    root: true
    description: Workspace credit balance.
    fields: [balance]

  - name: Error
    schema: Error
    fields: [code, message]

