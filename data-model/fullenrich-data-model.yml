observations:
  - >-
    Person and Company are reachable from both the async enrichment surface (as
    `profile`) and the sync search/lookup surface, using the same schema. That is
    the strongest modeling decision in the API — a search hit can be handed
    straight to enrichment without field remapping.
  - >-
    Company and EmploymentCompany are near-duplicate shapes; EmploymentCompany
    carries `industry` and `specialties` while Company carries `specialties` but no
    `industry`. A consumer normalizing companies across both surfaces has to
    reconcile them.
  - >-
    There is no cross-entity foreign key between an Enrichment and a Person beyond
    embedding — results are returned nested, never referenced by id, so there is no
    "fetch this person later by id" operation.
