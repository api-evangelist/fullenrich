source: >-
  Live GET of the /.well-known/ discovery surface on every FullEnrich host in
  apis.yml plus the OpenAPI servers[] host.
description: >-
  FullEnrich serves a real OAuth discovery surface on two hosts: the product API
  host (app.fullenrich.com, RFC 8414 + OIDC discovery with 13 scopes) and the MCP
  host (mcp.fullenrich.com, RFC 8414 + RFC 9728 protected-resource metadata). It
  serves no security.txt, no api-catalog and no ai-plugin.json of its own.
soft_200_warning: >-
  app.fullenrich.com and mcp.fullenrich.com answer HTTP 200 with an HTML
  application shell for ANY unknown /.well-known/* path. Those 200s are catch-alls,
  not documents, and are recorded below as misses. Only responses with
  content-type application/json carrying a real document are counted as hits.

