divergence_note: >-
  Neither surface is a superset. MCP adds a reference-vocabulary layer and a CSV
  export layer that REST does not publish; REST keeps API-key verification and
  deterministic single-record lookup that MCP does not expose. An agent restricted
  to one surface loses real capability either way.
