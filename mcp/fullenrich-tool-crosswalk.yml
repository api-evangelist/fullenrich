method: derived
source: >-
  Derived by aligning FullEnrich's published 13-tool MCP list
  (mcp/fullenrich-mcp-documentation.md, harvested verbatim from
  github.com/FullEnrich/fullenrich-skills) with the live REST OpenAPI 3.1.0
  harvested from https://mintcdn.com/fullenrich/QlQ00joQ41SH1_-N/api/v2/reference/openapi.yml
  (10 operations, archived at openapi/_original/fullenrich-openapi.yml and split
  one-per-resource under openapi/).
purpose: >-
  Bind each agent-facing MCP tool to the REST operation that backs it, so a bound
  tool inherits a REAL inputSchema (that operation's requestBody/parameters in the
  spec) instead of a guessed one. FullEnrich's MCP and REST surfaces are
  overlapping but NOT identical: the MCP layer adds reference-vocabulary and
  export tools that have no public REST operation.

surfaces:
  rest_openapi: openapi/
  rest_openapi_original: openapi/_original/fullenrich-openapi.yml
  rest_base_url: https://app.fullenrich.com/api/v2
  graphql: null
  mcp: https://mcp.fullenrich.com/mcp
  gating:
    rest: public spec, bearer API key at call time
    mcp: >-
      tools/list is OAuth-gated (HTTP 401 + RFC 9728 challenge), so tool names and
      descriptions come from the provider's own published tool table and bindings
      are mapped by name/semantics. Confidence is recorded honestly per row.

