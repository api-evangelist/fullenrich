    category: reverse-lookup
    rest: [postContactBulkReverseEmail, GetContactBulkReverseEmailByID]
    binding: rest
    confidence: high
    note: >-
      REST reverse lookup is asynchronous and bulk (POST returns an enrichment_id,
      GET retrieves). The MCP tool collapses both legs into one synchronous-looking
      call, so it fans out to two operations.
  - tool: enrich_bulk
    category: enrichment
    rest: [postContactBulkEnrich]
    binding: rest
    confidence: high
  - tool: get_enrichment_results
    category: enrichment
    rest: [GetContactBulkEnrichByID, GetContactBulkReverseEmailByID]
    binding: rest
    confidence: high
    note: One tool polls both the enrichment and reverse-email result endpoints.
  - tool: enrich_search_contact
    category: enrichment
    rest: [postPeopleSearch, postContactBulkEnrich]
    binding: rest
    confidence: medium
    note: >-
      Server-side composite — run a people search, then submit the matched
      contacts to bulk enrichment. No single REST operation performs both.

mcp_only:
  - tool: list_industries
    category: reference
    reason: >-
      Reference vocabulary for the `industries` / `current_company_industries`
      filters. The REST spec constrains these fields but publishes no operation
      that enumerates the valid codes; the enum list is human documentation only
      (docs.fullenrich.com/api/v2/general/enums).
  - tool: list_seniorities
    category: reference
    reason: >-
      Same shape as list_industries — the seniority vocabulary used by
      SearchPeopleRequest has no REST enumeration operation.
  - tool: list_functions_subfunctions
    category: reference
    reason: >-
      Function/subfunction vocabulary for people filters; no REST enumeration
      operation exists.
  - tool: export_contacts
    category: export
    reason: >-
      CSV export is an MCP/app capability. The REST API returns JSON only and
      publishes no export or download-link operation.
  - tool: export_companies
    category: export
    reason: CSV export of company search results; no REST counterpart.
  - tool: export_enrichment_results
    category: export
    reason: >-
      CSV/JSON export of an enrichment job, including download links and result
      metadata. REST exposes the results object but no export/download operation.

rest_only:
  - group: api key validation
    ops: [checkKey]
    reason: >-
      GET /account/keys/verify has no MCP tool — the MCP session authenticates
      with OAuth, not a bearer API key, so key validation is meaningless there.
  - group: single-record identity resolution
    ops: [postPeopleLookup, postCompanyLookup]
    reason: >-
      REST exposes deterministic lookup-by-identifier (professional network URL/ID,
      domain) returning the single best match. The MCP surface routes this through
      the broader search tools instead.

