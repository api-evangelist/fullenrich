agentPricingNote: >-
  The MCP surface prices exploration at zero: a search returns the first 10 results
  plus the total count for free, and credits are only spent on export (0.25 each)
  or enrichment. FullEnrich states the intent explicitly — "searching should feel
  like exploring, not like a commitment".

