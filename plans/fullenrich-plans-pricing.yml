description: >-
  FullEnrich publishes a canonical MACHINE-READABLE pricing document at
  https://fullenrich.com/pricing.md, explicitly written so agents can read and
  compare it, with an embedded JSON block of every plan and volume tier. Pricing
  is credit-based and pay-per-found: credits are consumed only when data is found
  and passes verification. Three plans — Free trial ($0, 50 credits, no card), Pro
  (from $29/mo monthly or $26/mo billed yearly, with eleven volume tiers), and
  custom Enterprise. Every plan includes unlimited users, all core features
  (waterfall enrichment, search, API, MCP, CRM integrations, bulk CSV), and credit
  rollover of 3 months (monthly) or 12 months (annual).
notes: >-
  Values below are transcribed from the provider's own machine-readable pricing
  document, which carries last_updated 2026-07-07 in its JSON block and
  "Last updated: July 14, 2026" in its footer. The document names itself a mirror
  of https://fullenrich.com/pricing and states that page is the source of truth if
  the two ever conflict.
sources:
- https://fullenrich.com/pricing.md
- https://fullenrich.com/pricing

machineReadable:
  markdown:
    url: https://fullenrich.com/pricing.md
    status: 200
    lastUpdated: '2026-07-07'
  json:
    url: https://fullenrich.com/pricing.json
    status: 404
    note: >-
      pricing.md advertises "Also served as JSON at
      https://fullenrich.com/pricing.json" but that URL returns 404 (the site's
      HTML 404 template). The JSON is still readable — it is embedded as a fenced
      code block inside pricing.md — but the standalone endpoint the document
      promises does not exist. Reported as a provenance issue.

pricingModel:
  type: credits_pay_per_found
  currency: USD
  includedUsers: unlimited
  billingPeriods: [monthly, annual]
  annualDiscount: ~10% vs monthly
  rollover:
    monthly: 3 months
    annual: 12 months
  principle: >-
    A lookup that returns nothing costs nothing. A landline found instead of a
    mobile costs nothing. ~30% of raw data is removed by verification before it
    reaches the user.

creditCosts:
- item: Verified work email
  credits: 1
  note: Verified by syntax, SMTP, catch-all deep-check and confidence score.
- item: Personal email
  credits: 3
- item: Mobile phone number
  credits: 10
  note: Mobile only — landlines are returned free.
- item: Reverse email lookup
  credits: 1
- item: Person + company profile (standalone)
  credits: 0.25
- item: Person + company profile (bundled with an enrichment)
  credits: 0
- item: Search or company record exported
  credits: 0.25
  note: Same rate on the API and the MCP server; re-exporting an already-exported record is free.
- item: Failed lookup / landline / out-of-service number
  credits: 0

